<h1>LINE 會議摘要</h1>
<p class="muted">個人自用工具，不對外提供服務。</p>

<p>這個工具在擁有者自己的電腦上執行：讀取擁有者本人 LINE 帳號裡的聊天訊息，找出約定好的會議與行程，
登記到擁有者 Google 日曆裡一個由本工具建立的子行事曆「LINE 擷取」，並每天推送一份摘要給擁有者。</p>

<p>本工具只申請 Google 日曆「建立次要行事曆，並管理其中活動」的權限（calendar.app.created），
看不到也改不了擁有者的其他行事曆。</p>
